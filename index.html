<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit!</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="icon" href="/images/rmt-ig-favicon.png" type="image/x-icon">
</head>
<body>
<div class="keys">
    <div data-key="KeyA" class="key">
        <kbd>A</kbd>
        <span class="sound">clap</span>
    </div>
    <div data-key="KeyS" class="key">
        <kbd>S</kbd>
        <span class="sound">hihat</span>
    </div>
    <div data-key="KeyD" class="key">
        <kbd>D</kbd>
        <span class="sound">openhat</span>
    </div>
    <div data-key="KeyF" class="key">
        <kbd>F</kbd>
        <span class="sound">ride</span>
    </div>
    <div data-key="KeyG" class="key">
        <kbd>G</kbd>
        <span class="sound">snare</span>
    </div>
    <div data-key="KeyH" class="key">
        <kbd>H</kbd>
        <span class="sound">snare2</span>
    </div>
    <div data-key="KeyJ" class="key">
        <kbd>J</kbd>
        <span class="sound">kick</span>
    </div>
    <div data-key="KeyK" class="key">
        <kbd>K</kbd>
        <span class="sound">boom</span>
    </div>
    <div data-key="KeyL" class="key">
        <kbd>L</kbd>
        <span class="sound">tom1</span>
    </div>
    <div data-key="Semicolon" class="key">
        <kbd>;</kbd>
        <span class="sound">tom2</span>
    </div>
</div>
<audio data-key="KeyA" src="/audio/key kit/01clap.wav"></audio>
<audio data-key="KeyS" src="/audio/key kit/02hihat.wav"></audio>
<audio data-key="KeyD" src="/audio/key kit/03ohh.wav"></audio>
<audio data-key="KeyF" src="/audio/key kit/04ride.wav"></audio>
<audio data-key="KeyG" src="/audio/key kit/05snare.wav"></audio>
<audio data-key="KeyH" src="/audio/key kit/06snare2.wav"></audio>
<audio data-key="KeyJ" src="/audio/key kit/07kick.wav"></audio>
<audio data-key="KeyK" src="/audio/key kit/08boom.wav"></audio>
<audio data-key="KeyL" src="/audio/key kit/09tom1.wav"></audio>
<audio data-key="Semicolon" src="/audio/key kit/10tom2.wav"></audio>
<script src="script.js"></script>
</body>
</html>
